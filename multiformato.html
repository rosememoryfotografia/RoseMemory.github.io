<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Creación Multiformato | Rose Memory</title>

<link rel="icon" type="image/png" href="logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" rel="stylesheet">

<style>

@font-face {
  font-family:'nexa';
  src:url('fonts/nexa.woff2') format('woff2');
}

@font-face {
  font-family:'mogilte';
  src:url('mogilte.woff') format('woff');
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0f0f0f;
  color:white;
  font-family:'Poppins',sans-serif;
}

header{
  position:fixed;
  top:0;
  width:100%;
  padding:20px 80px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(8px);
  z-index:100;
}

header h1{
  font-family:'mogilte';
  font-size:28px;
}

.boton{
  color:white;
  text-decoration:none;
  border:1px solid rgba(255,255,255,.3);
  padding:10px 18px;
  border-radius:12px;
  transition:.3s ease;
  font-family:'nexa';
}

.boton:hover{
  background:white;
  color:black;
}

main{
  padding:140px 50px 80px;
}

.titulo{
  font-family:'nexa';
  font-size:56px;
  margin-bottom:15px;
}

.subtitulo{
  color:rgba(255,255,255,.7);
  margin-bottom:50px;
  max-width:700px;
  line-height:1.8;
}

.masonry{
  columns:3 300px;
  column-gap:18px;
}

.masonry a{
  break-inside: avoid;
  display:block;
  margin-bottom:18px;
}

.masonry img{
  width:100%;
  height:350px;
  object-fit:cover;
  border-radius:18px;
  display:block;
  transition:transform .4s ease;
}

.masonry img:hover{
  transform:scale(1.05);
}

@media(max-width:768px){

  header{
    padding:20px;
  }

  main{
    padding:120px 20px 60px;
  }

  .titulo{
    font-size:38px;
  }

}

/* =====================
   MEJORAS MÓVIL - MULTIFORMATO
===================== */

html {
  scroll-behavior: smooth;
}

body {
  overflow-x: hidden;
}

img {
  max-width: 100%;
  display: block;
}

.masonry a {
  overflow: hidden;
  border-radius: 18px;
}

/* TABLET Y TELÉFONO */
@media(max-width:768px){

  header {
    padding: 14px 18px;
  }

  header h1 {
    font-size: 25px;
  }

  .boton {
    padding: 9px 18px;
    font-size: 12px;
    border-radius: 10px;
  }

  main {
    padding: 115px 18px 60px;
  }

  .titulo {
    font-size: clamp(36px, 11vw, 52px);
    line-height: 1;
    margin-bottom: 32px;
  }

 .masonry{
  columns:3 260px;
  column-gap:18px;
}

  .masonry a {
    margin-bottom: 18px;
  }

  .masonry img {
    height: 320px;
    border-radius: 18px;
  }

  .masonry img:hover {
    transform: none;
  }
}

/* TELÉFONOS PEQUEÑOS */
@media(max-width:480px){

  header {
    padding: 12px 16px;
  }

  header h1 {
    font-size: 23px;
  }

  main {
    padding: 105px 16px 50px;
  }

  .titulo {
    font-size: 38px;
    margin-bottom: 26px;
  }

  .masonry img {
    height: 280px;
  }
}

</style>
</head>

<body>

<header>

  <h1>Rose Memory</h1>

  <a href="index.html" class="boton">
    Volver
  </a>

</header>

<main>

  <h2 class="titulo">Creación Multiformato</h2>

  <div class="masonry">

    <a href="multiformato/multi1.jpg" class="glightbox">
      <img src="multiformato/multi1.jpg" loading="lazy">
    </a>

    <a href="multiformato/multi2.png" class="glightbox">
      <img src="multiformato/multi2.png" loading="lazy">
    </a>

    <a href="multiformato/multi3.jpg" class="glightbox">
      <img src="multiformato/multi3.jpg" loading="lazy">
    </a>

    <a href="multiformato/multi4.jpg" class="glightbox">
      <img src="multiformato/multi4.jpg" loading="lazy">
    </a>

    <a href="multiformato/multi5.png" class="glightbox">
      <img src="multiformato/multi5.png" loading="lazy">
    </a>

    <a href="multiformato/multi6.jpg" class="glightbox">
      <img src="multiformato/multi6.jpg" loading="lazy">
    </a>

    <a href="multiformato/multi7.jpg" class="glightbox">
      <img src="multiformato/multi7.jpg" loading="lazy">
    </a>

    <a href="multiformato/multi8.jpg" class="glightbox">
      <img src="multiformato/multi8.jpg" loading="lazy">
    </a>

    <a href="multiformato/multi9.jpg" class="glightbox">
      <img src="multiformato/multi9.jpg" loading="lazy">
    </a>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>

<script>
const lightbox = GLightbox({
  touchNavigation:true,
  loop:true
});
</script>

</body>
</html>
