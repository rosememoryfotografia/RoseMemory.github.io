<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rose Memory | Diseñador Gráfico</title>

<style>

/* =====================
   FUENTES LOCALES
===================== */
@font-face {
  font-family: 'BohemianSoul';
  src: url('bohemian-soul.woff') format('woff');
}

@font-face {
  font-family: 'MYRIADPRO-BOLD';
  src: url('myriadpro-bold.woff') format('woff');
}

@font-face {
  font-family: 'Mogilte';
  src: url('mogilte.woff') format('woff');
}

/* =====================
   RESET
===================== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #111;
  color: white;
}

/* =====================
   HERO
===================== */
.hero {
  height: 100vh;
  max-width: 1920px;
  margin: 0 auto;
  background:
    linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
    url('portada.jpg');
  background-size: cover;
  background-position: center;
  position: relative;
  display: flex;
  align-items: center;
  padding: 0 80px;
}

/* =====================
   MARCA (ARRIBA DERECHA)
===================== */
.marca {
  position: absolute;
  top: 30px;
  right: 80px;
  font-family: 'Mogilte';
  font-size: 26px;
  letter-spacing: 1px;
}

/* =====================
   CONTENIDO IZQUIERDO
===================== */
.hero-left {
  max-width: 480px;
}

/* Bienvenido */
.bienvenido {
  font-family: 'BohemianSoul';
  font-size: 32px;
  margin-bottom: 20px;
}

/* Texto descriptivo */
.descripcion {
  font-family: 'MYRIADPRO-BOLD';
  font-size: 18px;
  line-height: 1.5;
}

/* =====================
   TITULO PRINCIPAL
===================== */
.hero-title {
  position: absolute;
  left: 50%;
  transform: translateX(-10%);
  font-family: 'MyriadProBold';
  font-size: 96px;
  letter-spacing: -0.05em; /* tracking -50 */
  line-height: 0.95;
  text-align: left;
}

</style>
</head>

<body>

<section class="hero">

  <!-- Marca -->
  <div class="marca">Rose Memory</div>

  <!-- Texto izquierdo -->
  <div class="hero-left">
    <div class="bienvenido">¡Bienvenido!</div>
    <p class="descripcion">
      Es momento de crear<br>
      todo lo que te imaginas y<br>
      se vuelva realidad.
    </p>
  </div>

  <!-- Título principal -->
  <div class="hero-title">
    Diseñador<br>
    Gráfico
  </div>

</section>

</body>
</html>
