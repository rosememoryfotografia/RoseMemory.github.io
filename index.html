===================== */
* {

   ESTILO BASE (POPPINS)
===================== */
body {
  background: #111;
  color: white;
  font-family: 'Poppins', sans-serif;
  font-weight: 500;

===================== */
.page-wrapper {
  max-width: 1920px;

   HEADER / MENÚ
===================== */
header {
  position: fixed;

  width: 100%;

  padding: 20px 80px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(6px);
  z-index: 100;
}

header h1 {
  font-family: 'mogilte';
  font-size: 26px;
  letter-spacing: 1px;
}

nav a {
  margin-left: 25px;

===================== */

}
