<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Comunicación Visual | Rose Memory</title>

<link rel="icon" type="image/png" href="logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" rel="stylesheet">

<style>

/* =====================
   FUENTES LOCALES
===================== */

@font-face {
  font-family: 'nexa';
  src: url('fonts/nexa.woff2') format('woff2');
}

@font-face {
  font-family: 'mogilte';
  src: url('mogilte.woff') format('woff');
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#111;
  color:white;
  font-family:'Poppins', sans-serif;
}

header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  padding: 20px 80px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(6px);
  z-index: 100;
}

header h1{
  font-family:'mogilte';
  font-size:28px;
}

.boton-volver{
  color:white;
  font-family:'nexa';
  text-decoration:none;
  border:1px solid rgba(255,255,255,.3);
  padding:10px 18px;
  border-radius:12px;
  transition:.3s ease;
}

.boton-volver:hover{
  background:white;
  color:black;
}

section{
  padding:140px 50px 80px;
}

.titulo{
  font-size:56px;
  margin-bottom:70px;
  font-family:'nexa';
}

.descripcion{
  color:rgba(255,255,255,.75);
  margin-bottom:50px;
  max-width:700px;
  line-height:1.8;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:18px;
}

.grid img{
  width:100%;
  height:420px;
  object-fit:cover;
  border-radius:16px;
  transition:transform .4s ease;
  cursor:pointer;
  display:block;
}

.grid img:hover{
  transform:scale(1.05);
}

@media(max-width:768px){

  header{
    padding:20px;
  }

  section{
    padding:60px 20px;
  }

  .titulo{
  font-size:38px;
  margin-bottom:30px;
}

.grid img{
  height:300px;
}

}

/* =====================
   MEJORAS MÓVIL - COMUNICACIÓN VISUAL
===================== */

body{
  overflow-x:hidden;
}

img{
  max-width:100%;
  display:block;
}

.grid a{
  overflow:hidden;
  border-radius:16px;
  display:block;
}

/* TABLET Y TELÉFONO */
@media(max-width:768px){

  header{
    padding:14px 18px;
  }

  header h1{
    font-size:25px;
  }

  .boton-volver{
    padding:9px 18px;
    font-size:12px;
    border-radius:10px;
  }

  section{
    padding:115px 18px 60px;
  }

  .titulo{
    font-size:clamp(38px, 11vw, 52px);
    margin-bottom:35px;
    line-height:1;
  }

  .descripcion{
    font-size:15px;
    line-height:1.8;
    margin-bottom:35px;
  }

  .grid{
    grid-template-columns:1fr;
    gap:18px;
  }

  .grid img{
    height:320px;
    border-radius:18px;
  }

  .grid img:hover{
    transform:none;
  }
}

/* TELÉFONOS PEQUEÑOS */
@media(max-width:480px){

  header{
    padding:12px 16px;
  }

  header h1{
    font-size:23px;
  }

  section{
    padding:105px 16px 50px;
  }

  .titulo{
    font-size:40px;
    margin-bottom:28px;
  }

  .grid{
    gap:16px;
  }

  .grid img{
    height:280px;
  }
}

</style>
</head>

<header>
